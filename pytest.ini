[pytest]
# Without this, plain `pytest` cannot resolve the src.* imports; only
# `python -m pytest` works, because that puts the cwd on sys.path.
pythonpath = .

# Collect from tests/ only. Files under demos/ are named test_* and pytest
# happily collected them, but they are runnable demonstrations that expect a
# reachable database and real API endpoints, so a plain `pytest` run failed on
# them. Scoping collection here means `pytest` and `pytest tests/` agree; they
# previously did not, and a green scoped run hid a red full run.
testpaths = tests
